<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marte 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Gerando Marte em alta resolução…</div>
<div id="hud"><div id="compass">RUMO 000° N</div><div id="coords"></div><button id="mapbtn">Trocar Mapa (.jpg)</button></div>
<input type="file" id="mapfile" accept="image/*" hidden>
<div id="hint">Arraste · Role para zoom · Clique em Marte</div>
<div id="bubble">Olá, explorador! Clique em Marte para começar.</div>
<aside id="panel">
  <button id="pclose" aria-label="Fechar">×</button>
  <h2 id="pt"></h2><p class="sub" id="pc"></p><dl id="pd"></dl><p class="txt" id="px"></p>
  <small>Fonte: NASA Mars Exploration Program</small>
  <button class="btn" id="land">Pousar e Caminhar no Solo</button>
</aside>
<div id="actions" hidden><button class="btn" id="surf">Explorar Superfície</button><button class="btn ghost" id="back">↩ Voltar ao espaço</button></div>
<div id="busy" hidden>Pousando em Ares Vallis… gerando o terreno</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
